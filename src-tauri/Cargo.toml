[package]
name = "milch"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "milch"
path = "src/lib.rs"

# Zwei ausführbare Dateien auf derselben Datenschicht: das Programm, und der
# kleine Dienst, den `next dev` im Browser anspricht. Beide enden in
# `Store::run` — es gibt keine zweite Wahrheit.
[[bin]]
name = "milch"
path = "src/main.rs"

# Der Dienst wird nur auf Verlangen gebaut (`npm run data` gibt die Eigenschaft
# mit). Sonst legte Tauri ihn mit ins Installationsprogramm — er horcht auf
# 127.0.0.1:8787 und hat auf dem Rechner eines Benutzers nichts verloren.
[[bin]]
name = "serve"
path = "src/bin/serve.rs"
required-features = ["dev-serve"]

[features]
dev-serve = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Ohne Vorgaben: gebraucht wird das Feld aus Kästchen, nicht die Bildausgabe.
qrcode = { version = "0.14", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Die Aktualisierung holt und prüft das neue Paket, `process` startet danach
# neu. Beides gehört zusammen: ein eingespieltes Paket, das erst beim nächsten
# Öffnen von Hand wirksam wird, ist eine halbe Aktualisierung.
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tiny_http = "0.12"
